apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-nginx-conf
  namespace: aceest
data:
  default.conf: |
    server {
      listen 8080;

      location / {
        mirror /_shadow;
        mirror_request_body on;
        proxy_pass http://aceest-fitness.aceest.svc.cluster.local:80;
        proxy_set_header Host $host;
      }

      location = /_shadow {
        internal;
        proxy_pass http://aceest-fitness-shadow.aceest.svc.cluster.local:80$request_uri;
        proxy_pass_request_body on;
        proxy_set_header X-Shadow-Mirror "true";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-proxy
  template:
    metadata:
      labels:
        app: aceest-shadow-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: shadow-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-proxy
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-shadow-proxy
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30082
