
apiVersion: apps/v1

kind: Deployment

metadata:

  name: aceest-fitness-canary

  namespace: aceest

spec:

  replicas: 1

  selector:

    matchLabels:

      app: aceest-fitness

      track: canary

  template:

    metadata:

      labels:

        app: aceest-fitness

        track: canary

    spec:

      containers:

        - name: aceest-fitness

          image: sabyasachi1990/aceest-fitness:v2.1.0

          ports:

            - containerPort: 5000

          env:

            - name: APP_VERSION

              value: "v2.1.0"

            - name: RELEASE_TRACK

              value: "canary"

