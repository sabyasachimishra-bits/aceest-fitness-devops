
apiVersion: apps/v1

kind: Deployment

metadata:

  name: aceest-fitness-stable

  namespace: aceest

spec:

  replicas: 3

  selector:

    matchLabels:

      app: aceest-fitness

      track: stable

  template:

    metadata:

      labels:

        app: aceest-fitness

        track: stable

    spec:

      containers:

        - name: aceest-fitness

          image: sabyasachi1990/aceest-fitness:v2.0.0

          ports:

            - containerPort: 5000

          env:

            - name: APP_VERSION

              value: "v2.0.0"

            - name: RELEASE_TRACK

              value: "stable"

